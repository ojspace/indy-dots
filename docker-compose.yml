services:
  indy-gateway:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: indy-gateway
    restart: unless-stopped
    # Loopback-only: Docker port publishes bypass UFW, so never bind 0.0.0.0
    # on a dev machine — access via SSH tunnel if remote access is needed.
    ports:
      - "127.0.0.1:8642:8642"
    environment:
      - ENVIRONMENT=development
      - DATA_DIR=/opt/data
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=8642
    env_file:
      - .env
    volumes:
      - ./data:/opt/data:rw
      - ./workspace-template:/opt/data/workspace:rw
      - ./profiles:/opt/data/profiles:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8642/health"]
      interval: 15s
      timeout: 5s
      retries: 3

  indy-web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: indy-web
    restart: unless-stopped
    # Loopback-only (see note above — Docker publishes bypass UFW).
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - indy-gateway
