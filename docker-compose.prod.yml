services:
  caddy:
    image: caddy:2-alpine
    container_name: indy-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - indy-gateway
      - indy-web

  indy-gateway:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: indy-gateway
    restart: unless-stopped
    # Bound to loopback only: the host firewall must NOT expose the gateway
    # directly — all public traffic goes through Caddy.
    ports:
      - "127.0.0.1:8642:8642"
    environment:
      - ENVIRONMENT=production
      - DATA_DIR=/opt/data
      - PROFILES_DIR=/opt/data/profiles
    env_file:
      - .env
    volumes:
      - /opt/data:/opt/data:rw
      - /opt/data/workspace:/opt/data/workspace:rw
      - /opt/data/vault:/opt/data/vault:rw
      - ./profiles:/opt/data/profiles:ro
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  indy-web:
    build:
      context: ./web
      dockerfile: Dockerfile
      args:
        # Baked at build time (Vite inlines env vars into the bundle).
        # Server still enforces AUTH_TOKEN on every route — this only
        # lets the dashboard authenticate itself.
        - VITE_AUTH_TOKEN=${VITE_AUTH_TOKEN:-}
    container_name: indy-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - VITE_GATEWAY_URL=/api
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
    depends_on:
      - indy-gateway

volumes:
  caddy_data:
  caddy_config:
