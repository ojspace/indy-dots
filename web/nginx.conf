server {
    listen 3000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers (defense in depth behind Caddy).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Never cache the SPA shell — deploys must reach users immediately.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Reverse proxy backend API (standalone runs; prod goes through Caddy).
    # Buffering off so /api/chat/stream (SSE) flushes live.
    location /api/ {
        proxy_pass http://indy-gateway:8642/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
